[package]
name = "shopping-sessions"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[[bin]]
name = "shopping-sessions"
path = "src/main.rs"

[dependencies]
memchr = "2"
mimalloc = { version = "0.1", default-features = false }
parquet = { version = "60", default-features = false }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
