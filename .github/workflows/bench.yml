name: bench

on:
  push:
    branches: [perf]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bench
  cancel-in-progress: false

env:
  SEED: "101"
  EVENTS: "20000000"
  CLICKS: "5000000"
  DATA: /home/runner/bench-data

jobs:
  bench:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Identical shards: each lands on whatever hardware the pool gives it.
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Machine
        run: |
          lscpu
          nproc
          free -g
          df -h /home/runner
          for f in avx avx2 bmi1 bmi2 f16c fma abm movbe xsave avx512f avx512bw avx512vl; do
            if grep -qw "$f" /proc/cpuinfo; then echo "flag $f: yes"; else echo "flag $f: NO"; fi
          done
          cat /sys/kernel/mm/transparent_hugepage/enabled /sys/kernel/mm/transparent_hugepage/defrag
          docker version --format '{{.Server.Version}}'

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python packages
        run: pip install --quiet polars pyarrow

      - name: Restore datasets
        id: data
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/bench-data
          key: data-${{ hashFiles('tools/gen/**') }}-s${{ env.SEED }}-e${{ env.EVENTS }}-c${{ env.CLICKS }}

      - name: Generate datasets
        if: steps.data.outputs.cache-hit != 'true'
        run: |
          cargo build --release --manifest-path tools/gen/Cargo.toml
          gen=tools/gen/target/release/generate
          rm -rf "$DATA"; mkdir -p "$DATA"
          time $gen --seed 1 --events 1000000 --clicks 250000 --output "$DATA/dev"
          time $gen --seed "$SEED" --events "$EVENTS" --clicks "$CLICKS" --output "$DATA/big"
          du -sh "$DATA"/*

      - name: Save datasets
        if: steps.data.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: /home/runner/bench-data
          key: ${{ steps.data.outputs.cache-primary-key }}

      - name: Build image
        run: |
          if grep -qw avx2 /proc/cpuinfo && grep -qw bmi2 /proc/cpuinfo && grep -qw fma /proc/cpuinfo && grep -qw movbe /proc/cpuinfo; then
            docker build -t pipeline:latest .
          else
            echo "::warning::runner lacks x86-64-v3; the CI image is built for x86-64-v2"
            sed 's/target-cpu=x86-64-v3/target-cpu=x86-64-v2/' Dockerfile > /tmp/Dockerfile.ci
            docker build -t pipeline:latest -f /tmp/Dockerfile.ci .
          fi

      - name: Fixtures (Docker)
        run: CPUS=$(nproc) python scripts/run_fixtures.py fixtures -- sh scripts/docker_run.sh

      - name: Dev answer (Docker)
        run: |
          out=$(mktemp -d)
          CPUS=$(nproc) sh scripts/docker_run.sh "$DATA/dev" "$out/dev"
          python scripts/compare.py "$out/dev" ci/dev-answer | tee /tmp/dev-check.txt
          tail -n 1 /tmp/dev-check.txt | grep -qx MATCH
          echo "::notice title=dev answer::$(tail -n 1 /tmp/dev-check.txt)"

      - name: Benchmark
        run: |
          python ci/bench.py --data "$DATA/big" --variants ci/variants.txt --work /home/runner/bench-work \
            --report /tmp/report.md --reps 5 --scaling "$(cat ci/scaling.txt 2>/dev/null)"
          cat /tmp/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Profile (HEAD, native, warm)
        if: matrix.shard == 1
        continue-on-error: true
        run: |
          sudo apt-get install -y -qq linux-tools-common "linux-tools-$(uname -r)" > /dev/null 2>&1 \
            || sudo apt-get install -y -qq linux-tools-generic > /dev/null 2>&1 || true
          perf=$(ls /usr/lib/linux-tools/*/perf 2>/dev/null | head -n 1); [ -n "$perf" ] || perf=perf
          sudo sysctl -q kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          rustup component add rust-src > /dev/null 2>&1 || true
          # HEAD built natively like the image, plus line tables (codegen unchanged).
          RUSTFLAGS="-C target-cpu=x86-64-v3" CARGO_PROFILE_RELEASE_DEBUG=line-tables-only \
            cargo build --release --quiet
          find "$DATA/big" -type f -print0 | xargs -0 cat > /dev/null
          out=$(mktemp -d)
          DATA_DIR="$DATA/big" OUTPUT_DIR="$out" NCPU=$(nproc) $perf record -q -F 2999 -o /tmp/perf.data target/release/pipeline 2> /tmp/perf-run.txt
          {
            echo; echo "## Profile of HEAD (perf, native, warm; self time)"; echo; echo '```'
            $perf report -i /tmp/perf.data --stdio --sort dso 2>/dev/null | grep -v '^#' | grep -v '^$' | head -n 12
            echo
            $perf report -i /tmp/perf.data --stdio --sort sym 2>/dev/null | grep -v '^#' | grep -v '^$' | head -n 45
            echo '```'
            echo; echo "### Hottest source lines per symbol"; echo; echo '```'
            timeout 600 $perf annotate -i /tmp/perf.data --stdio -l --full-paths 2>/dev/null \
              | python ci/srclines.py "$(rustc --print sysroot)" 0.4 | head -n 300
            echo '```'
          } > /tmp/profile.md
          cat /tmp/profile.md >> /tmp/report.md
          cat /tmp/profile.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish results
        if: always()
        run: |
          [ -f /tmp/report.md ] || echo "# Benchmark ${GITHUB_SHA} failed: see run ${GITHUB_RUN_ID}" > /tmp/report.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          wt=/home/runner/results-tree
          rm -rf "$wt"
          if git fetch -q origin bench; then
            git worktree add -q -B bench "$wt" FETCH_HEAD
          else
            git worktree add -q --detach "$wt"
            git -C "$wt" checkout -q --orphan bench
            git -C "$wt" rm -rfq .
          fi
          mkdir -p "$wt/results"
          cp /tmp/report.md "$wt/results/${GITHUB_SHA}-${{ matrix.shard }}.md"
          git -C "$wt" add results
          git -C "$wt" commit -q -m "Add benchmark results for ${GITHUB_SHA::7} shard ${{ matrix.shard }}"
          for attempt in 1 2 3 4 5 6 7 8; do
            git -C "$wt" push -q origin HEAD:bench && break
            git -C "$wt" pull -q --rebase origin bench
          done
